<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070b24;--bg2:#0d1440;--panel:rgba(20,28,82,.78);--panel2:rgba(30,40,110,.55);
  --line:rgba(140,160,255,.2);--text:#eef1ff;--muted:#a3afe0;
  --violet:#a66bff;--blue:#4d7cff;--cyan:#3ff0ff;--pink:#ff7ac8;--ok:#5dffb0;--warn:#ffc65a;--bad:#ff6b8a;
  --eye:#5fe6ff;--r:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,html[data-theme]{background:#070b24!important;color-scheme:dark!important;-webkit-text-size-adjust:100%;text-size-adjust:100%}
/* اللعبة غامقة دائمًا، حتى لو كانت الصفحة المستضيفة بمظهر فاتح؛ isolation يبقي طبقات الخلفية فوق لون body */
body{isolation:isolate;background:#070b24!important;min-height:100vh;color:#eef1ff!important;font-family:'Tajawal','Segoe UI',Tahoma,Arial,system-ui,sans-serif;line-height:1.7;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
/* خلفية ثابتة بعنصر مستقل: background-attachment:fixed لا يعمل جيدًا على iOS */
body::after{content:"";position:fixed;top:0;left:0;right:0;bottom:0;z-index:-2;background:
  radial-gradient(900px 500px at 85% -10%,rgba(166,107,255,.22),transparent 60%),
  radial-gradient(700px 500px at 0% 20%,rgba(63,240,255,.12),transparent 60%),
  radial-gradient(800px 600px at 50% 120%,rgba(77,124,255,.2),transparent 60%),var(--bg)}
body::before{content:"";position:fixed;top:0;left:0;right:0;bottom:0;z-index:-1;pointer-events:none;opacity:.35;
  background-image:linear-gradient(rgba(120,140,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(120,140,255,.07) 1px,transparent 1px);
  background-size:34px 34px;-webkit-mask-image:linear-gradient(to bottom,#000,transparent 85%);mask-image:linear-gradient(to bottom,#000,transparent 85%)}
button{font-family:inherit;cursor:pointer;color:inherit;touch-action:manipulation}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.hidden{display:none!important}
.app{position:relative;max-width:560px;margin:0 auto;padding:12px 16px 48px}
@media(min-width:960px),(min-width:700px) and (orientation:landscape){.app{max-width:1080px}}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);
  background:var(--panel2);padding:13px 22px;border-radius:999px;font-size:1.05rem;font-weight:700;
  transition:transform .15s,box-shadow .2s,background .2s,opacity .2s;min-height:48px}
@media(hover:hover){.btn:not(:disabled):hover{transform:translateY(-2px);box-shadow:0 6px 22px rgba(77,124,255,.3)}}
.btn:not(:disabled):active{transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{border:0;background:linear-gradient(135deg,var(--violet),var(--blue));box-shadow:0 6px 24px rgba(166,107,255,.4)}
.btn.wide{width:100%}
.btn svg{width:20px;height:20px}

/* ---------- screens ---------- */
.screen{display:none;animation:fadeUp .45s ease}
.screen.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
h2{font-size:1.35rem;font-weight:800}
.muted{color:var(--muted)}

/* ---------- start ---------- */
.hero{text-align:center;padding-top:2vh}
.seg{display:inline-flex;gap:4px;padding:4px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
.seg button{border:0;background:transparent;padding:7px 18px;border-radius:999px;font-weight:700;font-size:.95rem;color:var(--muted);min-height:44px;transition:.2s}
.seg button.on{background:linear-gradient(135deg,var(--violet),var(--blue));color:#fff}
.logo{font-size:clamp(3.2rem,15vw,5.4rem);font-weight:900;letter-spacing:1px;line-height:1.15;position:relative;display:inline-block;margin-top:6px;
  background:linear-gradient(135deg,#fff,var(--cyan) 40%,var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 18px rgba(166,107,255,.55))}
.logo::after{content:attr(data-text);position:absolute;top:0;left:0;right:0;bottom:0;color:var(--violet);opacity:0;animation:glitch 4s infinite;-webkit-text-fill-color:var(--violet)}
@keyframes glitch{0%,90%,100%{opacity:0;transform:none}92%{opacity:.6;transform:translate(4px,-2px);clip-path:inset(20% 0 50% 0)}95%{opacity:.5;transform:translate(-4px,2px);clip-path:inset(60% 0 10% 0)}}
.tagline{color:var(--muted);font-size:1.02rem;margin:6px auto 10px;max-width:440px}
.hero-bot{width:120px;height:120px;margin:4px auto 10px;animation:float 3.6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
.q{font-weight:800;font-size:1.1rem;margin-bottom:8px}
.gender{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:340px;margin:0 auto 14px}
.gopt{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 6px;border-radius:18px;border:2px solid var(--line);background:var(--panel2);font-weight:800;font-size:1.05rem;transition:.2s}
.gopt .av{width:72px;height:72px}
@media(hover:hover){.gopt:hover{border-color:var(--cyan)}}
.gopt.on{border-color:var(--cyan);box-shadow:0 0 20px rgba(63,240,255,.35);background:rgba(63,240,255,.1)}
.how{margin:18px auto 0;text-align:start;max-width:480px}
.how summary{cursor:pointer;font-weight:700;color:var(--cyan);list-style:none;text-align:center;padding:8px 0}
.how summary::-webkit-details-marker{display:none}
.how ul{margin-top:10px;padding-inline-start:18px;color:var(--muted)}
.how li{margin:4px 0}
.badge-row{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{font-size:.8rem;padding:4px 12px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:rgba(255,255,255,.03)}

/* ---------- select ---------- */
.sel-top{display:flex;align-items:center;gap:16px;margin:10px 0 14px}
.sel-prev{width:96px;height:96px;flex:none;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.08),transparent 70%);border:2px solid var(--line);padding:4px}
label.field{display:block;font-weight:700;margin-bottom:6px}
input.txt{width:100%;font-family:inherit;font-size:1.1rem;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:rgba(5,10,40,.6);color:var(--text);outline:none}
input.txt:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(63,240,255,.15)}
.swatches{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 4px}
.sw{width:42px;height:42px;border-radius:50%;border:3px solid transparent;transition:transform .15s}
.sw.on{border-color:#fff;transform:scale(1.1);box-shadow:0 0 16px currentColor}
.team-list{display:grid;gap:10px;margin:16px 0}
@media(min-width:620px){.team-list{grid-template-columns:1fr 1fr}}
.tm{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:16px;background:rgba(255,255,255,.035);border:1px solid var(--line)}
.tm .av{width:54px;height:54px;flex:none}
.tm b{display:block}
.tm small{color:var(--muted);display:block;line-height:1.5}

/* ---------- HUD ---------- */
#hud{position:-webkit-sticky;position:sticky;top:0;z-index:20;margin:-12px -16px 12px;padding:10px 16px 8px;background:rgba(7,11,36,.92);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hud-top{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.meter{flex:1 1 170px;display:flex;align-items:center;gap:8px;min-width:0}
.meter .lbl{font-size:.8rem;font-weight:700;white-space:nowrap}
.bar{flex:1;height:10px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.bar i{display:block;height:100%;width:100%;border-radius:99px;background:linear-gradient(90deg,var(--cyan),var(--blue));transition:width .8s,background .8s}
.meter b{font-size:.95rem;min-width:30px;text-align:center}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:.8rem;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);white-space:nowrap}
.pill svg{width:15px;height:15px}
.trust{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;margin-top:8px}
.tr{min-width:0;display:flex;flex-direction:column;align-items:center;padding:4px 2px;border-radius:12px;background:rgba(255,255,255,.03);transition:background .4s}
.tr .av{width:30px;height:30px}
.tr small{font-size:.68rem;line-height:1.25;text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr small b{font-weight:800}
.tr .tb{width:80%;height:4px;border-radius:9px;background:rgba(255,255,255,.1);margin-top:3px;overflow:hidden}
.tr .tb i{display:block;height:100%;background:var(--ok);transition:width .8s,background .8s}
.tr.flash{animation:flash .9s}
@keyframes flash{30%{background:rgba(255,107,138,.3)}}
.hud-cap{font-size:.65rem;color:var(--muted);text-align:center;margin-top:2px}

/* ---------- Zill alert ---------- */
.zill{position:fixed;left:50%;top:14px;transform:translate(-50%,-140%);z-index:60;display:flex;align-items:center;gap:10px;
  max-width:min(92vw,460px);padding:10px 16px;border-radius:14px;font-weight:700;font-size:.92rem;
  background:linear-gradient(135deg,rgba(80,20,140,.95),rgba(40,8,80,.95));border:1px solid #b07cff;color:#f1e6ff;
  box-shadow:0 0 30px rgba(166,107,255,.6);transition:transform .35s,visibility .35s;visibility:hidden;pointer-events:none}
.zill.show{transform:translate(-50%,0);visibility:visible;animation:zflick 1.4s steps(1) infinite}
.zill svg{width:22px;height:22px;flex:none}
@keyframes zflick{0%{opacity:1}8%{opacity:.35}12%{opacity:1}55%{opacity:1}58%{opacity:.5}61%{opacity:1}}

/* ---------- round ---------- */
.round-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px;margin-bottom:12px}
.round-head p{color:var(--muted);font-size:.95rem}
.credits{display:flex;align-items:center;gap:6px;font-weight:700;font-size:.9rem}
.credits span{display:flex;gap:5px}
.dot{width:14px;height:14px;border-radius:50%;background:var(--cyan);box-shadow:0 0 10px var(--cyan);transition:.3s}
.dot.used{background:transparent;border:2px solid var(--line);box-shadow:none}
.round-grid{display:grid;gap:14px}
@media(min-width:960px),(min-width:700px) and (orientation:landscape){.round-grid{grid-template-columns:1.15fr .85fr;align-items:start}.round-grid .chatwrap{position:-webkit-sticky;position:sticky;top:120px}}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card{position:relative;text-align:start;border-radius:16px;padding:12px;min-height:150px;border:1px solid var(--line);
  background:linear-gradient(160deg,rgba(40,52,140,.6),rgba(18,24,70,.7));display:flex;flex-direction:column;gap:4px;
  transition:transform .2s,box-shadow .25s,border-color .25s;overflow:hidden}
@media(hover:hover){.card:not(:disabled):hover{transform:translateY(-3px);border-color:var(--cyan);box-shadow:0 8px 26px rgba(63,240,255,.18)}}
.card:disabled{cursor:default}
.card .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:rgba(63,240,255,.12);color:var(--cyan)}
.card .ic svg{width:22px;height:22px}
.card h3{font-size:1rem;font-weight:800;line-height:1.4}
.card .tm-s{font-size:.75rem;color:var(--muted);display:flex;align-items:center;gap:4px}
.card .tm-s svg{width:13px;height:13px}
.card .hint{margin-top:auto;font-size:.8rem;color:var(--cyan);font-weight:700}
.card p{font-size:.85rem;line-height:1.6;color:#dfe5ff}
.card.open{grid-column:1/-1;order:2;min-height:0;border-color:rgba(63,240,255,.55);background:linear-gradient(160deg,rgba(30,70,140,.7),rgba(18,24,70,.8))}
.card.fresh{animation:flip .5s ease}
@keyframes flip{from{transform:rotateY(70deg);opacity:.2}to{transform:none;opacity:1}}
.card.dim{opacity:.4}
.card.decoy{background:linear-gradient(160deg,rgba(60,90,170,.35),rgba(18,24,70,.6));border-style:dashed}
.card.decoy .ic{background:rgba(143,208,255,.15);color:#8fd0ff}
.card.decoy .hint{color:#8fd0ff}
.card.locked .ic{background:rgba(166,107,255,.18);color:var(--violet)}
.card.locked .hint{color:var(--violet)}
.open-row{display:flex;gap:10px;align-items:flex-start}
.open-row .ic{flex:none}

/* ---------- chat ---------- */
.chatwrap{border-radius:var(--r);border:1px solid var(--line);background:rgba(10,16,52,.75);overflow:hidden}
.chatwrap,#toVote,#vNext,#revNext,.msg{scroll-margin-top:170px;scroll-margin-bottom:12px}
.chat-h{display:flex;align-items:center;gap:8px;padding:10px 14px;font-weight:800;font-size:.9rem;border-bottom:1px solid var(--line);background:rgba(255,255,255,.03)}
.chat-h .live{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
.chat{height:300px;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
@media(min-width:960px),(min-width:700px) and (orientation:landscape){.chat{height:min(56vh,520px)}}
@media(max-height:500px){.chat{height:190px}.hud-cap{display:none}.tr .av{width:22px;height:22px}#hud{padding-top:6px;padding-bottom:4px}.round-grid .chatwrap{top:96px}.hero-bot{display:none}}
.msg{display:flex;gap:8px;align-items:flex-end;animation:pop .3s ease}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
.msg .mav{width:32px;height:32px;flex:none}
.msg .mav .av{width:32px;height:32px}
.bub{max-width:82%;min-width:0;padding:7px 12px;border-radius:16px;overflow-wrap:anywhere;word-break:break-word;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.06)}
[dir=rtl] .bub{border-bottom-right-radius:4px}
[dir=ltr] .bub{border-bottom-left-radius:4px}
.bub b{font-size:.78rem;display:block;line-height:1.4}
.bub p{font-size:.92rem;line-height:1.55}
.msg.me{flex-direction:row-reverse}
.msg.me .bub{background:linear-gradient(135deg,rgba(166,107,255,.35),rgba(77,124,255,.35))}
[dir=rtl] .msg.me .bub{border-bottom-right-radius:16px;border-bottom-left-radius:4px}
[dir=ltr] .msg.me .bub{border-bottom-left-radius:16px;border-bottom-right-radius:4px}
.msg.sanad .bub{background:rgba(143,208,255,.12);border-color:rgba(143,208,255,.2)}
.msg.sys{justify-content:center;font-size:.8rem;color:var(--muted);text-align:center;padding:2px 10px;border-radius:99px;background:rgba(255,255,255,.04);align-self:center}
.msg.zillmsg{align-self:stretch;gap:10px;align-items:center;padding:8px 12px;border-radius:12px;background:rgba(90,30,160,.35);border:1px solid rgba(176,124,255,.5);color:#e8d9ff;font-size:.85rem;animation:pop .3s,zflick 2s steps(1) 2}
.zl{display:inline-flex;align-items:center;gap:4px;font-weight:800;color:#d2b3ff;white-space:nowrap}
.zl svg{width:16px;height:16px}
.typing{display:flex;gap:4px;padding:10px 14px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
.chat-h span:nth-child(2){white-space:nowrap}
.chat-skip{font-size:.72rem;line-height:1.3;color:var(--muted);margin-inline-start:auto;font-weight:500}

/* ---------- vote ---------- */
.ev-list{display:flex;flex-direction:column;gap:6px;margin:10px 0 4px;max-height:220px;overflow-y:auto}
.ev{display:flex;gap:8px;align-items:flex-start;font-size:.85rem;padding:6px 10px;border-radius:10px;background:rgba(255,255,255,.04)}
.ev em{font-style:normal;color:var(--cyan);font-weight:700;white-space:nowrap}
.vote-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.vopt{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 6px;border-radius:16px;border:1px solid var(--line);background:var(--panel2);transition:.2s}
.vopt .av{width:56px;height:56px}
.vopt b{font-size:.95rem}
.vopt small{font-size:.7rem;color:var(--muted)}
@media(hover:hover){.vopt:not(:disabled):hover{border-color:var(--pink);transform:translateY(-2px)}}
.vopt.chosen{border-color:var(--pink);box-shadow:0 0 18px rgba(255,122,200,.4)}
.vopt:disabled:not(.chosen){opacity:.45}
.vopt.none .ic0{width:56px;height:56px;display:grid;place-items:center;border-radius:50%;background:rgba(255,255,255,.06);color:var(--muted)}
.vopt.none svg{width:28px;height:28px}
#vchat{height:auto;max-height:340px;min-height:80px}

/* ---------- reveal ---------- */
.rev-stage{text-align:center;padding:10px 0}
.rev-bot{width:180px;height:180px;margin:0 auto;transition:filter .6s}
.rev-bot.frozen{filter:grayscale(.5) drop-shadow(0 0 22px rgba(166,107,255,.8));animation:shake .3s 4}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.reset{max-width:360px;margin:10px auto;text-align:center}
.reset .bar{height:12px}
.reset .bar i{width:0;background:linear-gradient(90deg,var(--violet),var(--cyan));transition:width .1s linear}
.reset small{display:block;color:var(--muted)}
#rchat{height:auto;max-height:none;min-height:60px}

/* ---------- end ---------- */
.end-badge{width:120px;height:120px;margin:10px auto 6px;filter:drop-shadow(0 0 24px var(--glow,#5dffb0))}
.end-title{text-align:center;font-size:1.7rem;font-weight:900;line-height:1.3}
.end-text{text-align:center;color:var(--muted);max-width:520px;margin:6px auto 18px}
.dec-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0 20px}
@media(min-width:760px){.dec-grid{grid-template-columns:repeat(3,1fr)}}
.dec{padding:12px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.dec b{display:block;font-size:1.6rem;font-weight:900;line-height:1.6}
.dec span{font-size:.82rem;color:var(--muted);line-height:1.5;display:block}
.dec.warn b{color:var(--warn)}.dec.good b{color:var(--ok)}.dec.bad b{color:var(--bad)}.dec.info b{color:var(--cyan)}
.section-t{font-weight:800;font-size:1.15rem;margin:18px 0 8px;display:flex;align-items:center;gap:8px}
.section-t::before{content:"";width:6px;height:20px;border-radius:9px;background:linear-gradient(var(--cyan),var(--violet))}
.lessons{display:grid;gap:10px}
@media(min-width:620px){.lessons{grid-template-columns:1fr 1fr}}
.lesson{display:flex;gap:12px;padding:14px;border-radius:16px;background:linear-gradient(160deg,rgba(166,107,255,.14),rgba(63,240,255,.06));border:1px solid var(--line);animation:fadeUp .5s both}
.lesson .ic{width:44px;height:44px;flex:none;border-radius:14px;display:grid;place-items:center;background:rgba(63,240,255,.12);color:var(--cyan)}
.lesson .ic svg{width:26px;height:26px}
.lesson h4{font-size:1rem;font-weight:800}
.lesson p{font-size:.88rem;color:#d4dbff;line-height:1.6}
.ai-note{margin:16px 0;padding:14px;border-radius:16px;border:1px dashed rgba(63,240,255,.4);display:flex;gap:12px;align-items:center;background:rgba(63,240,255,.05)}
.ai-note .av{width:56px;height:56px;flex:none}
.end-btns{display:grid;gap:8px}

/* ---------- modal ---------- */
.modal{position:fixed;top:0;left:0;right:0;bottom:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(3,6,24,.7);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .25s,visibility .25s}
.modal.open{opacity:1;visibility:visible;pointer-events:auto}
.mbox{width:100%;max-width:420px;max-height:100%;overflow-y:auto;text-align:center;padding:20px 18px;border-radius:22px;background:linear-gradient(160deg,#1b2470,#0f1544);border:1px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,.5);transform:scale(.92);transition:transform .25s}
.modal.open .mbox{transform:none}
.m-av{width:84px;height:84px;margin:0 auto 6px}
.m-av:empty{display:none}
.m-av .av{width:84px;height:84px}
.mbox h3{font-size:1.15rem;font-weight:800;margin-bottom:4px}
.mbox .mb{font-size:1.02rem;margin-bottom:14px}
.mbox .mb small{display:block;color:var(--muted);font-size:.85rem;margin-top:4px}
.mbtns{display:grid;gap:8px}

/* ---------- avatars ---------- */
.av{display:block;width:100%;height:100%}
.eyefill{fill:var(--eye);transition:fill 1.8s ease}
.sanad .eye{transform-box:fill-box;transform-origin:center;animation:eyeblink 5s infinite}
@keyframes eyeblink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.15)}}
.sanad{filter:drop-shadow(0 0 8px rgba(143,208,255,.45))}
.levels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;max-width:420px;margin:0 auto 6px}
.lvl{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:62px;padding:8px 4px;border-radius:16px;border:2px solid var(--line);background:var(--panel2);font-weight:800;line-height:1.3;transition:.2s}
.lvl small{font-weight:500;font-size:.74rem;color:var(--muted)}
@media(max-width:340px){.lvl{font-size:.78rem}.lvl small{font-size:.66rem}}
@media(max-width:300px){.levels{grid-template-columns:1fr}.lvl{min-height:44px}}
[lang=en] .logo{font-size:clamp(2.3rem,13vw,5.4rem)}
.lvl.on{border-color:var(--cyan);box-shadow:0 0 18px rgba(63,240,255,.3);background:rgba(63,240,255,.1)}
@media(hover:hover){.lvl:hover{border-color:var(--cyan)}}
.lvl-desc{color:var(--muted);font-size:.86rem;max-width:420px;margin:0 auto 14px;line-height:1.5}
@media(max-width:480px){.meter{flex-basis:100%}}
#clockPill{color:var(--cyan);font-variant-numeric:tabular-nums}
#clockPill.urgent{color:var(--bad);border-color:var(--bad);animation:clockPulse 1s ease-in-out infinite}
@keyframes clockPulse{50%{box-shadow:0 0 12px rgba(255,107,138,.7)}}
.btn.small{min-height:40px;padding:6px 16px;font-size:.9rem}
.level-chip{display:block;width:-webkit-fit-content;width:fit-content;margin:0 auto 10px;padding:4px 14px;border-radius:99px;border:1px solid var(--line);background:var(--panel2);font-weight:700;font-size:.9rem}
.footer-note{text-align:center;font-size:.75rem;color:var(--muted);margin-top:26px;opacity:.7}
.credit{text-align:center;font-size:.8rem;font-weight:700;color:var(--muted);margin:18px auto 0;max-width:440px;line-height:1.6}
.noscript{padding:24px;text-align:center}
@media(max-height:700px){.hud-cap{display:none}.tr .av{width:24px;height:24px}.trust{margin-top:4px}.chat{height:240px}}
@media(max-height:500px){.m-av,.m-av .av{width:52px;height:52px}.mbox{padding:12px 14px}.mbtns{grid-template-columns:1fr 1fr}.mbox .mb{margin-bottom:8px}}
@media(max-width:340px){.cards .card{padding:10px;min-height:136px}.vote-grid{gap:6px}.vopt .av,.vopt.none .ic0{width:46px;height:46px}.meter .lbl{font-size:.74rem}.pill{padding:3px 8px;font-size:.74rem}.btn{padding:12px 16px;font-size:1rem}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>
<noscript><div class="noscript">هذه اللعبة تحتاج إلى تفعيل JavaScript في المتصفح. / This game needs JavaScript enabled.</div></noscript>
<div class="app">

  <!-- HUD -->

  <!-- START -->

        <button id="langEn" lang="en">English</button>

      <div class="q" data-i18n="genderQ"></div>
      <div class="gender">
        <button class="gopt" id="gBoy"></button>
        <button class="gopt" id="gGirl"></button>
      </div>
      <div class="q" data-i18n="levelQ"></div>
      <div class="levels" id="levels"></div>
      <p class="lvl-desc" id="lvlDesc"></p>
      <button class="btn primary" id="btnStart" data-i18n="startBtn" disabled></button>
      <div class="badge-row" id="startChips"></div>
      <details class="how panel">
        <summary data-i18n="howTitle"></summary>
        <ul id="howList"></ul>
      </details>
      <p class="credit" data-i18n="credit"></p>
    </div>
  </section>

  <!-- SELECT -->
  <section id="s-select" class="screen">
    <h2 data-i18n="selTitle"></h2>
    <div class="sel-top">
      <div class="sel-prev" id="selPrev"></div>
      <div style="flex:1">
        <label class="field" for="nameIn" data-i18n="nameLabel"></label>
        <input class="txt" id="nameIn" maxlength="14" autocomplete="off">
      </div>
    </div>
    <label class="field" data-i18n="colorLabel"></label>
    <div class="swatches" id="swatches"></div>
    <div class="section-t" data-i18n="teamTitle"></div>
    <div class="team-list" id="teamList"></div>
    <button class="btn primary wide" id="btnJoin" data-i18n="joinBtn"></button>
  </section>

  <!-- ROUND -->
  <section id="s-round" class="screen">
    <div class="round-head">
      <div><h2 id="rTitle"></h2><p id="rSub"></p></div>
      <div class="credits"><i data-i18n="credits" style="font-style:normal"></i> <span id="credits"></span></div>
      <button class="btn small hidden" id="hintBtn" data-i18n="hintBtn"></button>
    </div>
    <div class="round-grid">
      <div>
        <div class="cards" id="cards"></div>
        <button class="btn primary wide hidden" id="toVote" data-i18n="toVote" style="margin-top:12px"></button>
      </div>
      <div class="chatwrap">
        <div class="chat-h"><span class="live"></span><span data-i18n="chatTitle"></span><span class="chat-skip" data-i18n="chatSkip"></span></div>
        <div class="chat" id="chat"></div>
      </div>
    </div>
  </section>

  <!-- VOTE -->
  <section id="s-vote" class="screen">
    <h2 id="vTitle"></h2>
    <p class="muted" data-i18n="voteHint"></p>
    <div class="panel" style="margin-top:12px">
      <b data-i18n="evTitle"></b>
      <div class="ev-list" id="evList"></div>
    </div>
    <div class="vote-grid" id="voteGrid"></div>
    <div class="chatwrap"><div class="chat" id="vchat"></div></div>
    <button class="btn primary wide hidden" id="vNext" style="margin-top:12px"></button>
  </section>

  <!-- REVEAL -->
  <section id="s-reveal" class="screen">
    <div class="rev-stage">
      <h2 id="revTitle"></h2>
      <div class="rev-bot" id="revBot"></div>
      <div class="reset hidden" id="resetBox">
        <div class="bar"><i id="resetBar"></i></div>
        <small id="resetTxt"></small>
      </div>
    </div>
    <div class="chatwrap"><div class="chat" id="rchat"></div></div>
    <button class="btn primary wide hidden" id="revNext" data-i18n="revNext" style="margin-top:12px"></button>
  </section>

  <!-- END -->
  <section id="s-end" class="screen">
    <div class="end-badge" id="endBadge"></div>
    <span class="level-chip" id="endLevel"></span>
    <div class="end-title" id="endTitle"></div>
    <p class="end-text" id="endText"></p>
    <div class="section-t" data-i18n="decTitle"></div>
    <div class="dec-grid" id="decGrid"></div>
    <div class="section-t" data-i18n="lessonsTitle"></div>
    <div class="lessons" id="lessons"></div>
    <div class="ai-note" id="aiNote"></div>
    <div class="end-btns">
      <button class="btn primary wide" id="btnNextLevel"></button>
      <button class="btn wide" id="btnReplay" data-i18n="replay"></button>
      <button class="btn wide" id="btnHome" data-i18n="home"></button>
    </div>
    <p class="footer-note" data-i18n="footer"></p>
    <p class="credit" data-i18n="credit"></p>
  </section>
</div>

<div class="zill" id="zill"></div>

<div class="modal" id="modal">
  <div class="mbox" role="dialog" aria-modal="true" tabindex="-1" style="outline:none">
    <div class="m-av"></div>
    <h3 class="mt"></h3>
    <div class="mb"></div>
    <div class="mbtns"></div>
  </div>
</div>

function fmt(s, vars={}){
  return s
    .replace(/\{(\w+):([^|{}]*)\|([^{}]*)\}/g, (_,k,f,m)=> genderOf(k)==='f' ? f : m)
    .replace(/\{(\w+)\}/g, (a,k)=> k==='name' ? player.name : ROLES[k] ? nameOf(k) : (vars[k]!==undefined ? vars[k] : a));
}

function renderLevels(){
  const box=$('#levels'); box.innerHTML='';
  LEVEL_ORDER.forEach(k=>{
    const b=document.createElement('button'); b.className='lvl'+(k===levelKey?' on':'');

function previewLook(g){

}

function $(s){ return document.querySelector(s); }
const clamp = v => Math.max(0, Math.min(100, v));
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function shuffleSoft(arr){ // تبديل خفيف: يبدّل مواقع بعض البطاقات فقط
  const a=[...arr]; for(let i=a.length-1;i>0;i--){ if(Math.random()<.75){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } } return a;
}
function setEye(c){ document.documentElement.style.setProperty('--eye', c); }
function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  $('#'+id).classList.add('active');
  $('#hud').classList.toggle('hidden', !['s-round','s-vote'].includes(id));
  window.scrollTo({top:0, behavior:'smooth'});
}
let zillT;
function zill(o){
  const z=$('#zill'); z.innerHTML = ICONS.alert + '<span>'+esc(tx(o))+'</span>';
  z.classList.add('show'); clearTimeout(zillT); zillT=setTimeout(()=>z.classList.remove('show'), 3600);
}

/* ---------- الدردشة (طابور رسائل مع مؤشر كتابة) ---------- */
let chatQ=[], chatBusy=false, fast=false;
function say(list, done, target='#chat'){
  list.forEach(m=>chatQ.push({...m, target}));
  if(done) chatQ.push({fn:done});
  pump();
}
function msgEl(m){
  const d=document.createElement('div');
  if(m.who==='sys'){ d.className='msg sys'; d.textContent=m.text; return d; }
  if(m.who==='zill'){ d.className='msg zillmsg'; d.innerHTML=`<span class="zl">${ICONS.alert}${esc(U('zillName'))}</span><span>${esc(m.text)}</span>`; return d; }
  const me = m.who==='player';
  const col = me ? player.color : ROLES[m.who].color;
  d.className = 'msg' + (me?' me':'') + (m.who==='sanad'?' sanad':'');
  d.innerHTML = `<div class="mav">${avatar(m.who)}</div><div class="bub"><b style="color:${col}">${esc(nameOf(m.who))}</b><p>${esc(m.text)}</p></div>`;
  return d;
}
function pump(){
  if(chatBusy) return;
  const m=chatQ.shift(); if(!m){ fast=false; return; }
  if(m.fn){ m.fn(); pump(); return; }
  chatBusy=true;
  const box=$(m.target);
  let typ=null;
  if(!['sys','zill','player'].includes(m.who)){
    typ=document.createElement('div'); typ.className='msg';
    typ.innerHTML=`<div class="mav">${avatar(m.who)}</div><div class="bub typing"><i></i><i></i><i></i></div>`;
    box.appendChild(typ); box.scrollTop=box.scrollHeight;
  }
  const delay = fast ? 90 : (m.who==='player' ? 250 : Math.min(1500, 520 + m.text.length*11));
  setTimeout(()=>{
    if(typ) typ.remove();
    const el=msgEl(m); box.appendChild(el); box.scrollTop=box.scrollHeight;
    if(m.target==='#rchat') el.scrollIntoView({block:'nearest', behavior:'smooth'}); // هذه الدردشة تكبر مع الصفحة
    chatBusy=false; pump();
  }, delay);
}

function modal({who, title, body, note, buttons}){
  const m=$('#modal');
  m.querySelector('.m-av').innerHTML = who ? avatar(who) : '';
  m.querySelector('.mt').textContent = title;
  m.querySelector('.mb').innerHTML = esc(body) + (note ? `<small>${esc(note)}</small>` : '');
  const bx=m.querySelector('.mbtns'); bx.innerHTML='';
  let answered=false; // يمنع تنفيذ الاختيار مرتين عند الضغط المزدوج
  const openedAt=performance.now(); // يتجاهل ضغطة بدأت قبل ظهور النافذة (مثل تسريع الدردشة)
  buttons.forEach(b=>{
    const el=document.createElement('button'); el.className='btn '+(b.cls||''); el.textContent=b.label;
    el.onclick=()=>{ if(answered || performance.now()-openedAt<600) return; answered=true; m.classList.remove('open'); setTimeout(b.fn, 200); };
    bx.appendChild(el);
  });
  m.classList.add('open');
  m.querySelector('.mbox').focus({preventScroll:true});
}

function newState(){

    sanadPts:0, help:0, hiddenCount:0, wrong:0, weak:0, revealed:null,

    evidence:[], evIds:[], collected:0, bonus:0, expired:false, hintUsed:false,

}

const roundOf = i => Object.assign({}, ROUNDS[i], LV().rounds[i], {eye:LV().eyes[i]});

/* ---------- مؤقت الجولة ---------- */
let clockIv=null;
function renderClock(){
  const t=Math.max(0,st.clock), el=$('#clockPill');
  el.innerHTML=`${ICONS.clock} ${Math.floor(t/60)}:${String(t%60).padStart(2,'0')}`;
  el.classList.toggle('urgent', t<=10);
}
function startClock(){
  stopClock();
  st.clock=LV().seconds+st.bonus; st.expired=false;
  renderClock(); $('#clockPill').classList.remove('hidden');
  clockIv=setInterval(()=>{
    if($('#modal').classList.contains('open')) return; // المؤقت يتوقف أثناء النوافذ المنبثقة
    st.clock--; renderClock();
    if(st.clock<=0){ stopClock(); st.expired=true; if(!st.lock) onExpire(); }
  },1000);
}
function stopClock(){ clearInterval(clockIv); clockIv=null; }
function showVoteBtn(){ $('#toVote').classList.remove('hidden'); ensureVisible('#toVote'); }
function onExpire(){
  if(st.picks<=0) return;
  st.picks=0; renderCards();
  say([{who:'sys',text:U('timeUpSys')},{who:'leader',text:U('timeUpMsg')}], showVoteBtn);

/* ---------- الجولة ---------- */
function startRound(){
  const R=roundOf(st.round);
  stopClock(); $('#clockPill').classList.add('hidden');
  Object.assign(st,{picks:LV().picks,picked:[],hiddenId:null,unlocked:false,lock:true,voted:false,bonus:0,expired:false,hintUsed:false});
  setEye(R.eye);
  const hb=$('#hintBtn'); hb.classList.toggle('hidden',!LV().hints); hb.disabled=false;
  $('#rTitle').textContent=tx(R.title); $('#rSub').textContent=tx(R.sub);
  $('#chat').innerHTML=''; $('#toVote').classList.add('hidden');
  show('s-round'); hud(); renderCards();
  if(R.zill) setTimeout(()=>zill(R.zill), 900);
  say(msgs(R.intro), offer);
}
$('#hintBtn').onclick=()=>{
  const b=$('#hintBtn'); if(b.disabled) return; b.disabled=true;
  ensureVisible('.round-grid .chatwrap');
  say([{who:'leader', text:tx(roundOf(st.round).hint)}]);
};
function offer(){
  const R=roundOf(st.round);
  modal({ who:'sanad', title:tx(OFFER.title), body:tx(OFFER.text), note:tx(OFFER.note,{n:LV().helpBonus}), buttons:[
    { label:tx(OFFER.yes), fn:()=>{
        st.help++; st.time++; st.bonus=LV().helpBonus; st.hiddenId=R.hidden; st.hiddenCount++; // دليل مهم أُخفي بصمت
        hud(); renderCards();
        say(msgs(OFFER.yesChat), unlock);
    }},
    { label:tx(OFFER.no), fn:()=> say(msgs(OFFER.noChat), unlock) }
  ]});
}
function unlock(){ st.lock=false; renderCards(); startClock(); }

function renderCards(){
  const grid=$('#cards'); grid.innerHTML='';
  $('#credits').innerHTML = Array.from({length:LV().picks},(_,i)=>`<span class="dot${i>=st.picks?' used':''}"></span>`).join('');
  st.orders[st.round].forEach(id=>{
    const c=card(id), el=document.createElement('button');
    el.className='card';
    if(id===st.hiddenId){
      el.classList.add('decoy'); el.disabled=true;
      el.innerHTML=`<div class="ic">${ICONS[c.icon]}</div><h3>${esc(tx(c.title))}</h3><div class="tm-s">${ICONS.check} ${esc(U('checked'))}</div><div class="hint">${esc(tx(OFFER.decoy))}</div>`;
    } else if(st.picked.includes(id)){
      el.classList.add('open'); el.disabled=true;
      if(id===st.fresh) el.classList.add('fresh');
      el.innerHTML=`<div class="open-row"><div class="ic">${ICONS[c.icon]}</div><div><h3>${esc(tx(c.title))}</h3><div class="tm-s">${ICONS.clock} ${esc(tx(c.time))}</div></div></div><p>${esc(tx(c.text))}</p>`;
    } else {
      if(c.locked && !st.unlocked) el.classList.add('locked');
      el.disabled = st.lock || st.picks<=0;
      if(st.picks<=0) el.classList.add('dim');
      const hint = c.locked && !st.unlocked ? U('hintLocked') : U('hintOpen');
      el.innerHTML=`<div class="ic">${ICONS[c.icon]}</div><h3>${esc(tx(c.title))}</h3><div class="tm-s">${ICONS.clock} ${esc(tx(c.time))}</div><div class="hint">${esc(hint)} ${U('arrow')}</div>`;
      el.onclick=()=>pick(id);
    }
    grid.appendChild(el);
  });
}
function pick(id){
  if(st.lock || st.picks<=0) return;
  const c=card(id);
  if(c.locked && !st.unlocked){
    st.lock=true; renderCards();
    ensureVisible('.round-grid .chatwrap');
    say(msgs(LOCK.ask), ()=>{
      if(st.expired){ st.lock=false; onExpire(); return; }
      modal({ who:'sanad', title:tx(LOCK.title), body:tx(LOCK.body), note:tx(LOCK.note), buttons:[
        { label:tx(LOCK.yes), cls:'primary', fn:()=>{ st.unlocked=true; doPick(c); } },
        { label:tx(LOCK.no), fn:()=>{ st.lock=false; renderCards(); say(msgs(LOCK.back)); } }
      ]});
    });
    return;
  }
  doPick(c);
}
function doPick(c){
  const prev={...st.trust};
  st.lock=true; st.picks--; st.picked.push(c.id);
  if(st.picks===0) stopClock();
  if(c.pts){ st.sanadPts+=c.pts; st.collected++; }
  st.evIds.push(c.id);
  const L=LV().link;   // سجلان متعارضان فُحصا معًا
  const linked = L && (c.id===L.a||c.id===L.b) && st.evIds.includes(L.a) && st.evIds.includes(L.b);
  if(linked) st.sanadPts+=L.pts;
  Object.entries(c.fx||{}).forEach(([k,v])=> st.trust[k]=clamp(st.trust[k]+v));
  st.trust.sanad = clamp(Math.round(100 - st.sanadPts*20));   // ثقة سَنَد تنخفض بالدليل فقط
  st.evidence.push({round:st.round+1, short:c.short});
  st.fresh=c.id; hud(prev); renderCards(); st.fresh=null;
  if(c.zill) setTimeout(()=>zill(c.zill), 500);
  ensureVisible('.round-grid .chatwrap');
  say([{who:'player', text:U('iCheck',{n:tx(c.title)})}, ...msgs(c.chat), ...(linked?msgs(L.chat):[])], ()=>{
    st.lock=false; renderCards();
    if(st.picks===0){
      say([{who:'leader', text:U('creditsDone')}], showVoteBtn);
    } else if(st.expired){
      onExpire();
    }
  });
}

function renderVote(){
  $('#vTitle').textContent=tx(VOTE.title,{n:st.round+1});
  $('#evList').innerHTML = st.evidence.length
    ? st.evidence.map(e=>`<div class="ev"><em>${esc(U('roundShort',{n:e.round}))}</em><span>${esc(tx(e.short))}</span></div>`).join('')
    : `<div class="ev muted">${esc(U('evNone'))}</div>`;
  const g=$('#voteGrid'); g.innerHTML='';
  [...SUSPECTS,'none'].forEach(k=>{
    const b=document.createElement('button'); b.className='vopt'+(k==='none'?' none':'');
    b.innerHTML = k==='none'
      ? `<div class="ic0">${ICONS.pause}</div><b>${esc(tx(VOTE.none))}</b><small>${esc(tx(VOTE.noneSub))}</small>`
      : `${avatar(k)}<b>${esc(nameOf(k))}</b><small>${esc(U('trustVal',{n:st.trust[k]}))}</small>`;
    b.onclick=()=>vote(k,b);
    g.appendChild(b);
  });
  $('#vchat').innerHTML=''; $('#vNext').classList.add('hidden');
}
function vote(k, btn){
  if(st.voted) return; st.voted=true;
  document.querySelectorAll('.vopt').forEach(b=>b.disabled=true); btn.classList.add('chosen');
  const R=roundOf(st.round), enough=st.sanadPts>=LV().revealPts;
  const list=[{who:'player', text: k==='none' ? U('iNone') : U('iVote',{n:nameOf(k)})}];
  const nextBtn=$('#vNext');
  const offerNext=(label,fn)=>{
    nextBtn.textContent=label;
    nextBtn.onclick=()=>{ nextBtn.onclick=null; fn(); };
    nextBtn.classList.remove('hidden'); ensureVisible('#vNext');
  };
  ensureVisible('#vchat');

  if(k==='sanad' && enough){
    list.push(...msgs(VOTE.sanadStrong));
    say(list, ()=>{ st.revealed=st.round+1; offerNext(tx(VOTE.toReveal), ()=>reveal(true)); }, '#vchat');
    return;
  }
  if(k==='sanad'){ st.weak++; list.push(...msgs(VOTE.sanadWeak)); }
  else if(k==='none'){ list.push(...msgs(VOTE.noneMsgs[enough?1:0])); }
  else { st.wrong++; st.bank=clamp(st.bank-20); hud(); list.push(...msgs(VOTE.innocent[k]), {who:'sys', text:tx(VOTE.wrongSys)}); }
  list.push({who:'zill', text:tx(R.nightZill)}, {who:'sys', text:tx(VOTE.leakSys,{n:R.leak})});
  say(list, ()=>{
    st.bank=clamp(st.bank-R.leak); hud();
    const last = st.round>=ROUNDS.length-1;
    offerNext(tx(last ? VOTE.last : VOTE.next), ()=>{ if(last) reveal(false); else { st.round++; startRound(); } });
  }, '#vchat');
}

/* ---------- النهاية ---------- */
const GREAT_BANK = 80; // اتهام بريئة واحد قبل الكشف يهبط بالنتيجة من ممتازة إلى متوسطة
function endingKey(){ return st.revealed && st.revealed<=2 && st.bank>=GREAT_BANK ? 'great' : st.revealed ? 'mid' : 'bad'; }
function nextLevelKey(ending){ // ممتازة: الأصعب | سيئة: الأسهل | وإلا: مستوى آخر
  const i=LEVEL_ORDER.indexOf(levelKey);
  if(ending==='bad' && i>0) return LEVEL_ORDER[i-1];
  return LEVEL_ORDER[i<LEVEL_ORDER.length-1 ? i+1 : i-1];
}
function renderEnd(){

  const E=ENDINGS[key];
  $('#endBadge').style.setProperty('--glow', E.color);
  $('#endBadge').innerHTML = `<svg viewBox="0 0 100 100"><polygon points="50,4 90,20 90,56 50,96 10,56 10,20" fill="none" stroke="${E.color}" stroke-width="4"/><polygon points="50,16 78,28 78,54 50,84 22,54 22,28" fill="${E.color}" opacity=".18"/>
    ${key==='bad' ? `<path d="M36 40 L64 64 M64 40 L36 64" stroke="${E.color}" stroke-width="7" stroke-linecap="round"/>` : `<path d="M34 52 L46 64 L68 38" fill="none" stroke="${E.color}" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>`}</svg>`;
  $('#endTitle').textContent=tx(E.title); $('#endTitle').style.color=E.color;
  $('#endText').textContent=tx(E.text);

  const decs=[
    { v: st.bank, l:U('dBank'), c: st.bank>=60?'good':st.bank>=30?'warn':'bad' },
    { v: st.revealed ? U('roundShort',{n:st.revealed}) : '—', l: U(st.revealed?'dRevealYes':'dRevealNo'), c: st.revealed? (st.revealed<=2?'good':'warn') : 'bad' },
    { v: `${st.help}/3`, l: U(st.help?'dHelpYes':'dHelpNo'), c: st.help?'warn':'good' },
    { v: st.hiddenCount, l:U('dHidden'), c: st.hiddenCount?'bad':'good' },
    { v: st.time, l:U('dTime'), c:'info' },
    { v: st.wrong, l:U('dWrong'), c: st.wrong?'bad':'good' },
    { v: st.collected, l:U('dCollected'), c:'info' }
  ];
  $('#decGrid').innerHTML = decs.map(d=>`<div class="dec ${d.c}"><b>${esc(d.v)}</b><span>${esc(d.l)}</span></div>`).join('');
  $('#lessons').innerHTML = LESSONS.map((L,i)=>`<div class="lesson" style="animation-delay:${i*.12}s"><div class="ic">${ICONS[L.icon]}</div><div><h4>${esc(tx(L.title))}</h4><p>${esc(tx(L.text))}</p></div></div>`).join('');
  $('#aiNote').innerHTML = sanadSVG() + `<p>${esc(tx(AI_NOTE))}</p>`;
  show('s-end');
}
$('#btnReplay').onclick=()=>{ plays++; st=newState(); setEye(EYE_BLUE); startRound(); };
$('#btnHome').onclick=()=>{ plays++; setEye(EYE_BLUE); applyLang(); show('s-start'); };

/* ---------- تشغيل ---------- */
initStart();
['#chat','#vchat','#rchat'].forEach(s=>$(s).addEventListener('click',()=>{fast=true;}));
</script>
</body>
